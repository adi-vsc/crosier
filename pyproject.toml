[project]
name = "crosier"
version = "0.1.0"
description = "Install-and-forget direction checks for long Claude Code sessions — a fresh, zero-context Claude instance periodically reviews a compressed digest of your session and flags drift before it compounds."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
