[project]
name = "crosier"
version = "0.2.0"
description = "Zero-context second opinions for long Claude Code sessions — /crosier:attack, and an experimental Stop gate that is off by default."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crosier = "crosier.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["benchmark", ".venv", "build", "dist", "graphify-out", ".crosier"]
